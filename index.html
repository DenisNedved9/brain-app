<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedaBrain - Trénink mozku a kódování</title>
  <style>
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: system-ui, -apple-system, sans-serif; 
      text-align: center; 
      padding: 50px; 
    }
    h1 { color: #38bdf8; font-size: 2.5rem; }
    p { color: #94a3b8; font-size: 1.2rem; }
    button { 
      background: #38bdf8; 
      color: #0f172a; 
      border: none; 
      padding: 12px 24px; 
      font-weight: bold; 
      font-size: 1rem;
      border-radius: 8px; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    button:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <h1 id="app-title">MedaBrain</h1>
  <p>Stav: Webové rozhraní je aktivní!</p>
  <button onclick="alert('Aplikace funguje správně!')">Vyzkoušet tlačítko</button>
</body>
</html>
