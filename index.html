<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainApp - Trénink mozku</title>
  <style>
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: system-ui, -apple-system, sans-serif; 
      text-align: center; 
      padding: 50px; 
    }
    h1 { color: #38bdf8; font-size: 2.5rem; }
    p { color: #94a3b8; font-size: 1.2rem; }
    button { 
      background: #38bdf8; 
      color: #0f172a; 
      border: none; 
      padding: 12px 24px; 
      font-weight: bold; 
      font-size: 1rem;
      border-radius: 8px; 
      cursor: pointer; 
      transition: background 0.2s;
    }
    button:hover { background: #7dd3fc; }
    #status-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #1e293b;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>BrainApp</h1>
  <p>Vítejte v aplikaci pro trénink logiky a matematiky.</p>

  <button onclick="testBackend()">Otestovat spojení s backendem</button>

  <div id="status-box">
    <p id="backend-status">Status backendu: Čekám na test...</p>
  </div>

  <script>
    const BACKEND_URL = "https://brain-app-nikp.onrender.com";

    async function testBackend() {
      const statusEl = document.getElementById("backend-status");
      statusEl.innerText = "Status backendu: Připojuji se...";
      
      try {
        const response = await fetch(BACKEND_URL + "/");
        const data = await response.json();
        statusEl.innerText = "Status backendu: " + JSON.stringify(data);
        statusEl.style.color = "#4ade80";
      } catch (error) {
        statusEl.innerText = "Status backendu: Chyba připojení!";
        statusEl.style.color = "#f87171";
      }
    }
  </script>
</body>
</html>
